name: Core checks
on:
  push:
    branches: [master]
  pull_request:
jobs:
  py-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m compileall -q kwjd.py scripts/server_worker.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke
        run: |
          python kwjd.py --help
          python kwjd.py status --role linux --root /tmp
